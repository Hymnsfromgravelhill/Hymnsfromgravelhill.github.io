name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'config.json'
      - 'assets/js/search.js'
      - 'assets/js/utils.js'
      - 'assets/img/**'
      - 'hymnals/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the hymn books and app screens into the app
        run: |
          dest=android/app/src/main/assets/www
          rm -rf "$dest" && mkdir -p "$dest/assets/js" "$dest/assets/img" "$dest/hymnals"
          cp android/app-ui/index.html "$dest/"
          cp -r android/app-ui/assets/css "$dest/assets/css"
          cp android/app-ui/assets/js/*.js "$dest/assets/js/"
          cp assets/js/search.js assets/js/utils.js "$dest/assets/js/"
          cp assets/img/icon.png "$dest/assets/img/"
          cp config.json "$dest/"
          cp hymnals/*.txt "$dest/hymnals/"
          du -sh "$dest"

      # A signing key is needed so each new APK can be installed over the previous one.
      # Best: add the four ANDROID_* secrets (see README). Otherwise a key is generated once and cached.
      - name: Restore cached signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: |
            ci-keystore.jks
            ci-keystore.pw
          key: hymns-ci-keystore-v1

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
              echo "ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing" >&2; exit 1
            fi
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
          else
            if [ ! -f ci-keystore.jks ] || [ ! -f ci-keystore.pw ]; then
              rm -f ci-keystore.jks ci-keystore.pw
              pw=$(openssl rand -hex 16)
              keytool -genkeypair -keystore ci-keystore.jks -storepass "$pw" -keypass "$pw" -alias hymns \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hymns from Gravel Hill"
              echo "$pw" > ci-keystore.pw
            fi
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/ci-keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$(cat ci-keystore.pw)" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=hymns" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$(cat ci-keystore.pw)" >> "$GITHUB_ENV"
          fi

      - name: Read app version
        run: |
          n=$(grep '^releaseNumber=' android/version.properties | cut -d= -f2 | tr -d '\r ')
          v=$(printf '0.%02d' "$n")
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          awk -v v="$v" '/^## /{p=($2==v)} p' android/CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Hymns app $v" > release-notes.md
          echo "Building version $v"

      - name: Build release APK
        run: gradle -p android assembleRelease

      - name: Name the APK (version is part of the file name)
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "HymnsFromGravelHill-${APP_VERSION}.apk"
          echo "APK_FILE=HymnsFromGravelHill-${APP_VERSION}.apk" >> "$GITHUB_ENV"

      - name: Verify the APK really is this version
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          info=$("$aapt2" dump badging "$APK_FILE" | grep -m1 '^package:')
          echo "$info"
          echo "$info" | grep -q "versionName='${APP_VERSION}'" || { echo "APK version does not match ${APP_VERSION}" >&2; exit 1; }
          echo "### Built Hymns app ${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "File: ${APK_FILE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show signing certificate (must be identical on every build)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$apksigner" ] && "$apksigner" verify --print-certs "$APK_FILE" | grep -E "Signer #1 certificate SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: HymnsFromGravelHill-${{ env.APP_VERSION }}
          path: ${{ env.APK_FILE }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: Hymns app ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: ${{ env.APK_FILE }}
